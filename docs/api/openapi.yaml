openapi: 3.1.0
info:
  title: Oke Gaas API
  version: 0.1.0
  description: |
    Initial unstable REST API for the first complete Oke Gaas vertical slice.
    Public compatibility is not yet guaranteed.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        "200":
          description: Healthy process
  /v1/projects:
    post:
      summary: Create a Project and return its API key once
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "201": { description: Project created }
        "401": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/players:
    post:
      summary: Register a Player
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: { type: string, maxLength: 255 }
      responses:
        "201": { description: Player registered }
        "401": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/levels:
    post:
      summary: Append the next immutable XP Level threshold
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_xp]
              properties:
                min_xp:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Must be strictly greater than the previous configured threshold.
      responses:
        "201": { description: Level threshold appended }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      summary: List the Project XP Level ladder
      description: Level 1 at 0 XP is implicit and is included in the response.
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Ordered Level thresholds including implicit level 1 }
        "401": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/counters:
    post:
      summary: Create an immutable Project Counter definition
      description: Counts accepted Events matching the exact event_type and all configured exact top-level property conditions. Counter names are unique per Project.
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event_type]
              properties:
                name: { type: string, maxLength: 255 }
                event_type: { type: string, maxLength: 255 }
                conditions:
                  type: object
                  additionalProperties: true
                  description: Optional exact top-level Event property values; every configured entry must match.
      responses:
        "201": { description: Counter definition created }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      summary: List immutable Counter definitions for a Project
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project Counter definitions }
        "401": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/players/{playerId}/counters:
    get:
      summary: Retrieve a Player's current Counter values
      description: Returns every Project Counter; the value is zero when no matching Event has been processed yet.
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Current Player Counter values }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/rules:
    post:
      summary: Create a version-1 exact-event XP rule with optional property, count, or UTC-day gating
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, xp]
              properties:
                event_type: { type: string, maxLength: 255 }
                xp: { type: integer, format: int64, minimum: 1 }
                conditions:
                  type: object
                  additionalProperties: true
                  description: Exact top-level Event property values; every configured entry must match.
                match_every:
                  type: integer
                  format: int64
                  minimum: 1
                  default: 1
                  description: Grant XP on every Nth matching Event for each Player.
                once_per_utc_day:
                  type: boolean
                  default: false
                  description: Grant at most once per UTC calendar day for each Player and Rule version, using Event occurred_at. Requires match_every=1.
      responses:
        "201": { description: Rule created }
  /v1/projects/{projectId}/events:
    post:
      summary: Process one idempotent external Event
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, player_id, type, occurred_at]
              properties:
                event_id: { type: string, maxLength: 255, description: Stable caller-supplied identity scoped to the Project }
                player_id: { type: string }
                type: { type: string, maxLength: 255 }
                occurred_at: { type: string, format: date-time }
                properties:
                  type: object
                  additionalProperties: true
      responses:
        "201": { description: Event accepted and processed }
        "200": { description: Identical retry returned without duplicate rewards }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/players/{playerId}/state:
    get:
      summary: Retrieve current Player XP and derived Level
      security: [{ ProjectBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Current Player State }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Server operator key configured with OKE_GAAS_ADMIN_API_KEY.
    ProjectBearer:
      type: http
      scheme: bearer
      description: Per-Project API key returned once at Project creation.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Consistent API error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
