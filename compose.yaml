services:
  postgres:
    image: postgres:17.10-alpine3.22@sha256:b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oke_gaas}
      POSTGRES_USER: ${POSTGRES_USER:-oke_gaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - oke_gaas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oke_gaas} -d ${POSTGRES_DB:-oke_gaas}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-oke_gaas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oke_gaas}?sslmode=disable"
      - "up"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      OKE_GAAS_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-oke_gaas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oke_gaas}?sslmode=disable"
      OKE_GAAS_ADMIN_API_KEY: ${OKE_GAAS_ADMIN_API_KEY:?OKE_GAAS_ADMIN_API_KEY is required}
    ports:
      - "${OKE_GAAS_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  oke_gaas_postgres:
