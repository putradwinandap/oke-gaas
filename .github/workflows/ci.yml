name: CI

on:
  pull_request:
    types:
      - labeled
      - synchronize
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  invalidate-ci-ready:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Remove stale ci-ready label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}" --jq '.labels[].name')"
          if echo "$labels" | grep -Fxq 'ci-ready'; then
            gh api               --method DELETE               "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/ci-ready"
            echo "Removed stale ci-ready label because the PR head changed."
          else
            echo "ci-ready is not present; nothing to invalidate."
          fi

  test:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ci-ready'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oke_gaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oke_gaas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oke_gaas_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -vet=off ./...
